<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지?</title>
  <style>
    /* 색을 한곳에 모아 두면, 나중에 톤을 바꿀 때 여기만 고치면 된다. */
    :root {
      --bg: #FDF6F0;           /* 전체 배경 */
      --card: #FFFFFF;         /* 카드 배경 */
      --text: #4A4036;         /* 기본 글자 */
      --text-soft: #8A7E72;    /* 보조 글자 */
      --primary: #F4A896;      /* 주 버튼 배경 */
      --primary-dark: #C9705A; /* 강조 글자와 테두리 */
      --line: #EFE4DA;         /* 구분선 */
      --chill: #A8DADC;        /* 냉장 */
      --freeze: #BDE0FE;       /* 냉동 */
      --room: #FFE5A5;         /* 실온 */
      --warn: #FFB4A2;         /* 유통기한 임박 */
      --danger: #E5989B;       /* 기한 지남 */

      /* 카드 모양도 변수로 두어, 입력 영역 등 다른 카드가 같은 모양을 쓰게 한다. */
      --card-radius: 16px;
      --card-shadow: 0 2px 8px rgba(74, 64, 54, 0.08);
    }

    /* 웹폰트를 불러오지 않기로 했으므로, 설치된 폰트 중 앞에서부터 있는 것을 쓴다. */
    body {
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
      /* 화면 맨 위에 제목이 붙어 답답해 보이지 않도록 위쪽만 더 띄운다. */
      padding-top: 32px;
    }

    /* 앱 이름이 가장 먼저 눈에 들어오도록 크고 굵게 둔다. */
    header h1 {
      font-size: 32px;
      font-weight: 800;
      /* 위쪽 여백은 body의 32px만 쓰도록 h1 기본 여백을 없앤다. */
      margin: 0 0 6px;
    }

    /* 설명은 제목보다 덜 눈에 띄도록 보조 글자색을 쓴다. */
    header p {
      color: var(--text-soft);
      margin: 0 0 16px;
    }

    /* 냉장고 상태를 숫자로 한눈에 보도록, 다른 카드와 같은 모양에 3칸으로 나눈다. */
    .summary-card {
      display: flex;
      background-color: var(--card);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 14px 0;
      margin-bottom: 16px;
    }

    .summary-cell {
      flex: 1;
      text-align: center;
    }

    /* 칸 사이에 얇은 선을 두어 세 숫자가 서로 섞여 보이지 않게 한다. */
    .summary-cell + .summary-cell {
      border-left: 1px solid var(--line);
    }

    .summary-number {
      font-size: 22px;
      font-weight: 700;
    }

    .summary-label {
      font-size: 12px;
      color: var(--text-soft);
    }

    /* 챙겨야 할 숫자는 색으로 구분해, 0이 아닐 때 바로 눈에 띄게 한다. */
    #soon-count {
      color: var(--primary-dark);
    }

    #expired-count {
      color: var(--danger);
    }

    /* 빈 냉장고일 때도 화면이 허전하지 않도록 큰 아이콘을 둔다. */
    .empty-icon {
      font-size: 44px;
      margin-bottom: 10px;
    }

    #add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
    }

    #add-form label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    /* 입력 영역도 재료 카드와 같은 모양이어야 화면이 한 덩어리로 보인다. */
    .add-card {
      background-color: var(--card);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 16px;
      margin-bottom: 16px;
    }

    .add-card h2 {
      margin-top: 0;
    }

    #add-form input,
    #add-form select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      font: inherit;
      color: var(--text);
    }

    /* 기본 파란 외곽선 대신 테두리 색을 바꿔, 지금 입력 중인 칸을 파스텔톤으로 알려 준다. */
    #add-form input:focus,
    #add-form select:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* 가로 전체 너비로 두면 flex 줄바꿈 때문에 버튼이 항상 맨 아래 한 줄을 차지한다. */
    #add-form button[type="submit"] {
      width: 100%;
      background-color: var(--primary);
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 10px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    /* 안내 문구는 경고처럼 무섭지 않게, 작고 부드러운 색으로 보여 준다. */
    #form-message {
      color: var(--danger);
      font-size: 13px;
      min-height: 1.2em;
      margin: 8px 0 0;
    }

    /* 좁은 휴대폰 화면에서는 칸이 옆으로 끼이지 않도록 한 줄에 하나씩 쌓는다. */
    @media (max-width: 480px) {
      #add-form {
        flex-direction: column;
        align-items: stretch;
      }
    }

    /* 테두리 대신 옅은 그림자로 카드를 배경에서 살짝 띄운다. */
    .item-card {
      background-color: var(--card);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 14px 16px;
      /* 왼쪽은 색 띠(20px) 바로 다음부터 16px 여백이 되도록 띠 너비를 더한다. */
      padding-left: 36px;
      margin-bottom: 10px;
      /* 윗줄과 아랫줄 사이 간격을 margin 대신 gap 하나로 관리한다. */
      display: flex;
      flex-direction: column;
      gap: 8px;
      /* 색 띠의 기준점을 카드로 잡기 위해 relative를 준다. */
      position: relative;
      /* 색 띠를 카드의 둥근 모서리 모양대로 잘라 내기 위해 넘치는 부분을 숨긴다. */
      overflow: hidden;
    }

    /* 보관 위치를 글자를 읽지 않고도 색으로 알아볼 수 있게 왼쪽에 세로 띠를 둔다. */
    .item-card::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 20px;
    }

    .item-card[data-location="냉장"]::before {
      background-color: var(--chill);
    }

    .item-card[data-location="냉동"]::before {
      background-color: var(--freeze);
    }

    .item-card[data-location="실온"]::before {
      background-color: var(--room);
    }

    /* 한 줄 안에서 왼쪽 묶음과 오른쪽 묶음을 양 끝으로 벌린다. */
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* 칩과 배지처럼 나란히 붙어 있어야 하는 것들을 한 묶음으로 둔다. */
    .card-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 재료 이름이 카드에서 가장 먼저 읽히도록 가장 크고 굵게 둔다. */
    .item-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .item-quantity {
      font-size: 14px;
      color: var(--text-soft);
    }

    /* 보관 위치는 왼쪽 색 띠로도 보이므로, 칩은 배지보다 작고 연하게 둔다. */
    .location-chip {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      background-color: var(--line);
      color: var(--text-soft);
    }

    /* 유통기한은 가장 중요한 정보라 알약 모양 배지로 따로 눈에 띄게 한다. */
    .expiry-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background-color: var(--line);
      color: var(--text-soft);
    }

    .expiry-badge.expired {
      background-color: var(--danger);
      color: #FFFFFF;
    }

    .expiry-badge.soon {
      background-color: var(--warn);
      color: var(--text);
    }

    /* 수정/삭제는 자주 누르지 않는 보조 동작이라 글자만 있는 가벼운 버튼으로 둔다. */
    .text-button {
      background: none;
      border: none;
      padding: 4px 8px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-soft);
    }

    .edit-button:hover {
      color: var(--primary-dark);
    }

    /* 삭제는 되돌릴 수 없으니 마우스를 올렸을 때 경고 색으로 바뀌게 한다. */
    .delete-button:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <h1>오늘 뭐 먹지?</h1>
    <p>냉장고에 있는 재료를 기록하고 유통기한을 챙겨요.</p>
  </header>

  <section class="summary-card">
    <div class="summary-cell">
      <div class="summary-number" id="total-count">0</div>
      <div class="summary-label">전체</div>
    </div>
    <div class="summary-cell">
      <div class="summary-number" id="soon-count">0</div>
      <div class="summary-label">임박</div>
    </div>
    <div class="summary-cell">
      <div class="summary-number" id="expired-count">0</div>
      <div class="summary-label">지남</div>
    </div>
  </section>

  <section class="add-card">
    <h2>🛒 재료 추가</h2>
    <form id="add-form">
      <label>
        재료 이름
        <input type="text" id="name-input">
      </label>
      <label>
        수량
        <input type="number" id="quantity-input" min="0" step="any">
      </label>
      <label>
        단위
        <select id="unit-select">
          <option value="개">개</option>
          <option value="g">g</option>
          <option value="ml">ml</option>
          <option value="봉">봉</option>
        </select>
      </label>
      <label>
        보관 위치
        <select id="storage-select">
          <option value="냉장">냉장</option>
          <option value="냉동">냉동</option>
          <option value="실온">실온</option>
        </select>
      </label>
      <label>
        유통기한
        <input type="date" id="expiry-input">
      </label>
      <button type="submit">추가</button>
    </form>
    <p id="form-message"></p>
  </section>

  <section>
    <h2>🧺 내 냉장고</h2>
    <div id="item-list"></div>
  </section>

  <script>
    // localStorage에 저장할 때 쓰는 key. 나중에 집밥일지 등 다른 데이터와 섞이지 않도록 앞에 "todaymeal."을 붙인다.
    const STORAGE_KEY = "todaymeal.items";

    // 유통기한이 이 날짜 수 이내로 남으면 "D-n"으로 표시한다.
    const SOON_EXPIRY_DAYS = 3;

    // 앱이 다루는 재료 목록. 화면은 항상 이 배열을 기준으로 다시 그린다.
    let items = loadItems();

    // 지금 수정 중인 재료의 id. 한 번에 한 카드만 수정할 수 있게 하나만 기억한다.
    let editingItemId = null;

    // ---------- 저장 / 불러오기 ----------

    function loadItems() {
      const savedText = localStorage.getItem(STORAGE_KEY);
      if (savedText === null) {
        return [];
      }
      // 저장된 값이 깨져 있어도 앱 전체가 멈추지 않도록 빈 목록으로 시작한다.
      try {
        const parsedItems = JSON.parse(savedText);
        return Array.isArray(parsedItems) ? parsedItems : [];
      } catch (error) {
        return [];
      }
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function createItemId() {
      // 같은 밀리초에 두 개가 추가돼도 겹치지 않도록 무작위 문자열을 덧붙인다.
      return Date.now().toString() + Math.random().toString(16).slice(2);
    }

    // ---------- 날짜 계산 ----------

    function parseDateString(dateString) {
      // new Date("2026-10-28")은 UTC 기준으로 해석되어 한국 시간에서 날짜가 어긋날 수 있다.
      // 그래서 연/월/일을 직접 나눠 로컬 날짜로 만든다.
      const [year, month, day] = dateString.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function getToday() {
      // 시각을 0시로 맞춰야 "오늘"과 "유통기한 날짜"를 일 단위로 정확히 비교할 수 있다.
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function getDaysUntilExpiry(expiryDateString) {
      const millisecondsPerDay = 24 * 60 * 60 * 1000;
      const difference = parseDateString(expiryDateString) - getToday();
      // 서머타임 등으로 생기는 몇 시간 차이를 반올림으로 흡수한다.
      return Math.round(difference / millisecondsPerDay);
    }

    function formatExpiryLabel(expiryDateString) {
      if (!expiryDateString) {
        return "유통기한 없음";
      }
      const daysLeft = getDaysUntilExpiry(expiryDateString);
      if (daysLeft < 0) {
        return "기한 지남";
      }
      if (daysLeft <= SOON_EXPIRY_DAYS) {
        return "D-" + daysLeft;
      }
      return expiryDateString;
    }

    function getExpiryStatus(expiryDateString) {
      // 배지 색을 고르기 위한 상태값. 기준은 formatExpiryLabel과 같다.
      if (!expiryDateString) {
        return "normal";
      }
      const daysLeft = getDaysUntilExpiry(expiryDateString);
      if (daysLeft < 0) {
        return "expired";
      }
      if (daysLeft <= SOON_EXPIRY_DAYS) {
        return "soon";
      }
      return "normal";
    }

    // ---------- 정렬 ----------

    function sortItemsByExpiry(itemList) {
      // 원본 배열 순서를 건드리지 않도록 복사본을 정렬한다.
      return [...itemList].sort(function (firstItem, secondItem) {
        const firstHasExpiry = Boolean(firstItem.expiryDate);
        const secondHasExpiry = Boolean(secondItem.expiryDate);

        // 유통기한이 없는 재료는 맨 뒤로 보낸다.
        if (!firstHasExpiry && !secondHasExpiry) return 0;
        if (!firstHasExpiry) return 1;
        if (!secondHasExpiry) return -1;

        // "YYYY-MM-DD" 형식은 글자 순서가 곧 날짜 순서라서 문자열 비교로 충분하다.
        return firstItem.expiryDate.localeCompare(secondItem.expiryDate);
      });
    }

    // ---------- 추가 ----------

    function handleAddSubmit(event) {
      // 폼 제출 시 페이지가 새로고침되는 기본 동작을 막는다.
      event.preventDefault();

      const name = document.getElementById("name-input").value.trim();
      const quantityText = document.getElementById("quantity-input").value;

      if (name === "" || quantityText === "") {
        showFormMessage("재료 이름과 수량을 입력해 주세요");
        return;
      }

      const newItem = {
        id: createItemId(),
        name: name,
        quantity: Number(quantityText),
        unit: document.getElementById("unit-select").value,
        storage: document.getElementById("storage-select").value,
        expiryDate: document.getElementById("expiry-input").value
      };

      items.push(newItem);
      saveItems();
      clearAddForm();
      showFormMessage("");
      renderItemList();
    }

    function showFormMessage(message) {
      document.getElementById("form-message").textContent = message;
    }

    function clearAddForm() {
      // 단위와 보관 위치는 연달아 비슷한 재료를 넣을 때 편하도록 그대로 둔다.
      document.getElementById("name-input").value = "";
      document.getElementById("quantity-input").value = "";
      document.getElementById("expiry-input").value = "";
      document.getElementById("name-input").focus();
    }

    // ---------- 수정 ----------

    function startEditing(itemId) {
      editingItemId = itemId;
      renderItemList();
    }

    function cancelEditing() {
      editingItemId = null;
      renderItemList();
    }

    function saveEditedItem(itemId, quantityText, expiryDate) {
      if (quantityText === "") {
        alert("수량을 입력해 주세요");
        return;
      }
      const targetItem = items.find(function (item) {
        return item.id === itemId;
      });
      targetItem.quantity = Number(quantityText);
      targetItem.expiryDate = expiryDate;
      saveItems();
      editingItemId = null;
      renderItemList();
    }

    // ---------- 삭제 ----------

    function deleteItem(itemId, itemName) {
      // 실수로 누르는 경우를 막기 위해 한 번 더 확인한다.
      const isConfirmed = confirm("'" + itemName + "'을(를) 삭제할까요?");
      if (!isConfirmed) {
        return;
      }
      items = items.filter(function (item) {
        return item.id !== itemId;
      });
      saveItems();
      renderItemList();
    }

    // ---------- 화면 그리기 ----------

    function renderItemList() {
      const listElement = document.getElementById("item-list");
      listElement.innerHTML = "";

      // 추가/수정/삭제가 모두 이 함수로 화면을 다시 그리므로, 요약 숫자도 여기서 함께 갱신한다.
      renderSummary();

      if (items.length === 0) {
        const emptyIcon = document.createElement("div");
        emptyIcon.className = "empty-icon";
        emptyIcon.textContent = "🧊";
        listElement.appendChild(emptyIcon);

        const emptyMessage = document.createElement("p");
        emptyMessage.textContent = "냉장고가 비어 있어요. 재료를 추가해 보세요.";
        listElement.appendChild(emptyMessage);
        return;
      }

      sortItemsByExpiry(items).forEach(function (item) {
        listElement.appendChild(createItemCard(item));
      });
    }

    function renderSummary() {
      // 임박/지남 기준은 배지 색과 같은 getExpiryStatus를 써서 숫자와 배지가 항상 일치하게 한다.
      const soonItems = items.filter(function (item) {
        return getExpiryStatus(item.expiryDate) === "soon";
      });
      const expiredItems = items.filter(function (item) {
        return getExpiryStatus(item.expiryDate) === "expired";
      });
      document.getElementById("total-count").textContent = items.length;
      document.getElementById("soon-count").textContent = soonItems.length;
      document.getElementById("expired-count").textContent = expiredItems.length;
    }

    function createItemCard(item) {
      const card = document.createElement("div");
      card.className = "item-card";
      // CSS가 이 값을 보고 왼쪽 색 띠의 색을 정한다.
      card.dataset.location = item.storage;

      if (item.id === editingItemId) {
        card.appendChild(createNameElement(item));
        card.appendChild(createEditSection(item));
      } else {
        card.appendChild(createTopRow(item));
        card.appendChild(createBottomRow(item));
      }
      return card;
    }

    function createNameElement(item) {
      const nameElement = document.createElement("p");
      nameElement.className = "item-name";
      // 사용자가 입력한 글자는 innerHTML이 아닌 textContent로 넣어야 HTML로 해석되지 않아 안전하다.
      nameElement.textContent = item.name;
      return nameElement;
    }

    // 윗줄: 왼쪽에 재료 이름, 오른쪽 끝에 수량과 단위
    function createTopRow(item) {
      const row = document.createElement("div");
      row.className = "card-row";

      const quantityElement = document.createElement("span");
      quantityElement.className = "item-quantity";
      quantityElement.textContent = item.quantity + item.unit;

      row.appendChild(createNameElement(item));
      row.appendChild(quantityElement);
      return row;
    }

    // 아랫줄: 왼쪽에 보관 위치 칩과 유통기한 배지, 오른쪽 끝에 수정/삭제 버튼
    function createBottomRow(item) {
      const row = document.createElement("div");
      row.className = "card-row";

      const infoGroup = document.createElement("div");
      infoGroup.className = "card-group";
      infoGroup.appendChild(createLocationChip(item.storage));
      infoGroup.appendChild(createExpiryBadge(item.expiryDate));

      const buttonGroup = document.createElement("div");
      buttonGroup.className = "card-group";
      const editButton = createButton("수정", function () {
        startEditing(item.id);
      });
      editButton.className = "text-button edit-button";
      const deleteButton = createButton("삭제", function () {
        deleteItem(item.id, item.name);
      });
      deleteButton.className = "text-button delete-button";
      buttonGroup.appendChild(editButton);
      buttonGroup.appendChild(deleteButton);

      row.appendChild(infoGroup);
      row.appendChild(buttonGroup);
      return row;
    }

    function createLocationChip(storage) {
      const chip = document.createElement("span");
      chip.className = "location-chip";
      chip.textContent = storage;
      return chip;
    }

    function createExpiryBadge(expiryDateString) {
      const badge = document.createElement("span");
      // 상태 이름을 class로 붙여, 색은 CSS에서 정하게 한다.
      badge.className = "expiry-badge " + getExpiryStatus(expiryDateString);
      badge.textContent = formatExpiryLabel(expiryDateString);
      return badge;
    }

    function createEditSection(item) {
      const section = document.createElement("div");

      const quantityInput = document.createElement("input");
      quantityInput.type = "number";
      quantityInput.min = "0";
      quantityInput.step = "any";
      quantityInput.value = item.quantity;

      const expiryInput = document.createElement("input");
      expiryInput.type = "date";
      expiryInput.value = item.expiryDate;

      section.appendChild(createLabeledField("수량 (" + item.unit + ")", quantityInput));
      section.appendChild(createLabeledField("유통기한", expiryInput));

      const saveButton = createButton("저장", function () {
        saveEditedItem(item.id, quantityInput.value, expiryInput.value);
      });
      const cancelButton = createButton("취소", cancelEditing);
      section.appendChild(saveButton);
      section.appendChild(cancelButton);
      return section;
    }

    function createLabeledField(labelText, inputElement) {
      const label = document.createElement("label");
      label.textContent = labelText + " ";
      label.appendChild(inputElement);
      // 입력칸이 한 줄씩 보이도록 label을 블록 요소처럼 감싼다.
      const wrapper = document.createElement("p");
      wrapper.appendChild(label);
      return wrapper;
    }

    function createButton(buttonText, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = buttonText;
      button.addEventListener("click", onClick);
      return button;
    }

    // ---------- 시작 ----------

    document.getElementById("add-form").addEventListener("submit", handleAddSubmit);
    renderItemList();
  </script>
</body>
</html>
